name: Heeler
options:
  bundleIdPrefix: dev.houz42
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.42.0"

settings:
  base:
    # Swift 6 language mode implies complete strict concurrency checking.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Fork: personal team pinned (from the Apple Development cert's OU field);
    # upstream pins their paid-program team id here.
    DEVELOPMENT_TEAM: AX4Z34XFC2
    CODE_SIGN_STYLE: Automatic

packages:
  # Repository-local package owning the libssh2/OpenSSL implementation and
  # checked-in native artifacts. The one SSH backend (ADR 0011).
  HeelerSSH:
    path: Packages/HeelerSSH
  # Pin the reviewed 1.6.20260909 source commit. Its prebuilt libghostty is
  # Ghostty 82938b633ba6 with SwiftPM checksum
  # 2d9a26e80c3836c450f03ea2cf9d191841d9093d4f61c1cea466d2fc8e215dbb.
  GhosttyTerminal:
    url: https://github.com/Lakr233/libghostty-spm.git
    revision: "7e45d27160f9b34aca9ca5c9820e9207482f9f04"
  # Rich markdown rendering for chat text (headers, code blocks, tables).
  # houz42 fork of gonzalezreal/MarkdownUI 2.4.1 (fork: houz42/swift-markdown-ui,
  # branch fix/inline-concat-depth) carrying the TextInlineRenderer patch that
  # flattens the per-inline-node Text fold: upstream's N-deep
  # ConcatenatedTextStorage tree overflowed the main-thread stack on cold
  # launch (crash logs 2026-09-20). Exact commit pin, never a floating branch.
  MarkdownUI:
    url: https://github.com/houz42/swift-markdown-ui.git
    revision: "17b3ff4c678896028b71bc038558200d0c3fa22e"
  # Swift semantic syntax coloring for chat code blocks (MIT, JohnSundell).
  # Exact tag pin: 0.16.0 is the newest tagged release.
  Splash:
    url: https://github.com/JohnSundell/Splash
    exactVersion: "0.16.0"

targets:
  Heeler:
    type: application
    platform: iOS
    sources:
      - path: Sources/Heeler
        excludes:
          # Bundled as a folder reference below so notice files stay under
          # Notices/ in the app bundle rather than flattening to the root.
          - Resources/Notices
      # Notification code shared with the service extension: envelope
      # decryption, Notification Key store, alert renderer (ADR 0008).
      - Sources/HeelerNotificationCore
      # Live Activity attributes + details envelope (shared with HeelerWidgets).
      - Sources/HeelerActivityCore
      # Widget views double-included so Xcode can host their #Preview gallery
      # in the app target (plain previews are unsupported inside app-extension
      # targets); the @main WidgetBundle stays extension-only.
      - Sources/HeelerWidgets/AgentLiveActivityWidget.swift
      - Sources/HeelerWidgets/AgentActivityDecryptor.swift
      # Audited third-party notices + inventory.json (#161). Folder reference
      # preserves the Notices/ subdirectory the catalogue resolves against.
      - path: Sources/Heeler/Resources/Notices
        type: folder
        buildPhase: resources
    info:
      path: Sources/Heeler/Info.plist
      properties:
        # XcodeGen would otherwise hardcode 1.0/1 here, and a file value wins
        # over the generated one; keep both versions on the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # A dragged Console row carries this activity; iPadOS creates a new
        # window from it only for a declared type. The generated scene
        # manifest already declares multiple-scene support.
        NSUserActivityTypes:
          - dev.houz42.meadow.agent
    entitlements:
      path: Sources/Heeler/Heeler.entitlements
      properties:
        # Fork: aps-environment removed — free personal teams cannot get the
        # push entitlement (upstream sets it for their paid program).
        # Shared with the Notification Service Extension; doubles as the
        # Keychain access group holding the Notification Keys.
        com.apple.security.application-groups:
          - group.dev.houz42.meadow.shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.houz42.meadow
        # Home-screen name; the App Store listing is "Heeler for herdr".
        INFOPLIST_KEY_CFBundleDisplayName: Meadow
        MARKETING_VERSION: "0.1.8"
        CURRENT_PROJECT_VERSION: "20"
        # Scan to Pair (#62) reads the Pairing Code QR from the computer screen.
        INFOPLIST_KEY_NSCameraUsageDescription: "Meadow uses the camera to scan the Pairing Code shown on your computer, so you can add that machine without typing anything."
        # iOS 14+ silently blocks connections to private addresses — the
        # LAN and VPN paths every Host dials — until the Local Network
        # permission is granted, and never prompts without this declaration
        # (it is the prompt's body).
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Meadow connects to your machines on your local network to reach your agents."
        # Only exempt encryption is used (standard SSH algorithms via the
        # HeelerSSH package's libssh2/OpenSSL, OS-provided CryptoKit);
        # declaring it here keeps every TestFlight upload from stalling on the
        # Missing Compliance prompt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # iPhone and iPad. App Store Connect derives device support from the build.
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # ActivityKit starts Live Activities from the app; HeelerWidgets renders them.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # The design's accent pair (prototype --accent) as ONE adaptive
        # asset: light #22644D, dark #9ACFB2. Drives every Color.accentColor
        # use app-wide (links, tints, chips, author lines) — see
        # Assets.xcassets/AccentColor. AccentWash (#EAF2ED / #2D4236) is the
        # paired soft-fill token.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Splash
      - package: HeelerSSH
      - package: GhosttyTerminal
      - package: MarkdownUI
      - package: GhosttyTerminal
        product: GhosttyTheme
      - target: HeelerNotificationService
      - target: HeelerWidgets

  # Decrypts Agent Notifications before display (ADR 0008, #71). A thin
  # shell: the logic lives in HeelerNotificationCore, tested from the app
  # suite. The extension cannot link the app, so the shared sources (and the
  # few app files they lean on) are compiled in directly.
  HeelerNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - Sources/HeelerNotificationService
      - Sources/HeelerNotificationCore
      - Sources/Heeler/Support/Base64URL.swift
      - Sources/Heeler/Transport/SecretStore.swift
      # For AgentStatus; Foundation-only by construction (JSONValue is the
      # generated file's one in-repo dependency).
      - Sources/Heeler/Transport/Generated/HerdrAPITypes.swift
      - Sources/Heeler/Transport/JSONValue.swift
    entitlements:
      path: Sources/HeelerNotificationService/HeelerNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.houz42.meadow.shared
    info:
      path: Sources/HeelerNotificationService/Info.plist
      properties:
        # An app extension's versions must match its containing app's, or
        # App Store validation rejects the bundle. XcodeGen would otherwise
        # hardcode its own 1.0/1 defaults here; point at the build settings
        # so both bundles stay in lockstep.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # App Store validation (code 90360) requires a display name on
        # every embedded appex; never user-visible for this extension.
        CFBundleDisplayName: Meadow Notification Service
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.houz42.meadow.NotificationService
        MARKETING_VERSION: "0.1.8"
        CURRENT_PROJECT_VERSION: "20"
        # Match the containing app's iPhone and iPad device family.
        TARGETED_DEVICE_FAMILY: "1,2"

  # Lock-screen / Dynamic Island Live Activity (docs/agents/live-activity-contract.md).
  # Thin WidgetKit shell: attributes, envelope open, and Notification Key
  # selection live in HeelerActivityCore / HeelerNotificationCore, compiled
  # in the same way as the notification service extension (the appex cannot
  # link the app). @main is the WidgetBundle; there is no principal class.
  HeelerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Sources/HeelerWidgets
      - Sources/HeelerActivityCore
      - Sources/HeelerNotificationCore
      - Sources/Heeler/Support/Base64URL.swift
      - Sources/Heeler/Transport/SecretStore.swift
      # For AgentStatus; Foundation-only by construction (JSONValue is the
      # generated file's one in-repo dependency). NotificationEnvelope in
      # HeelerNotificationCore needs it.
      - Sources/Heeler/Transport/Generated/HerdrAPITypes.swift
      - Sources/Heeler/Transport/JSONValue.swift
      # Shared with the app Console; single hex owner for status colors (#247).
      - Sources/Heeler/Console/AgentStatusPalette.swift
    entitlements:
      path: Sources/HeelerWidgets/HeelerWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.houz42.meadow.shared
    info:
      path: Sources/HeelerWidgets/Info.plist
      properties:
        # An app extension's versions must match its containing app's, or
        # App Store validation rejects the bundle. XcodeGen would otherwise
        # hardcode its own 1.0/1 defaults here; point at the build settings
        # so both bundles stay in lockstep.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # App Store validation (code 90360) requires a display name on
        # every embedded appex. Also the counts-only lock-screen fallback.
        CFBundleDisplayName: Meadow
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.houz42.meadow.Widgets
        MARKETING_VERSION: "0.1.8"
        CURRENT_PROJECT_VERSION: "20"
        # Match the containing app's iPhone and iPad device family.
        TARGETED_DEVICE_FAMILY: "1,2"

  HeelerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/HeelerTests
      # Shared Pairing Code vectors (ADR 0007): the same file the Node plugin
      # tests consume, bundled so the Swift tests cannot drift from it.
      - path: plugin/test-vectors/pairing-code-v1.json
        buildPhase: resources
      # Shared notification envelope vectors (ADR 0008), same arrangement.
      - path: plugin/test-vectors/notification-payload-v1.json
        buildPhase: resources
      # Shared Live Activity details envelope vectors, same arrangement.
      - path: plugin/test-vectors/live-activity-content-v1.json
        buildPhase: resources
      # Shared sidebar layout snapshot vectors, consumed by Node and Swift.
      - path: plugin/test-vectors/sidebar-layout-v1.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.houz42.meadow.tests
    dependencies:
      - target: Heeler
      - package: HeelerSSH
      - package: GhosttyTerminal
      - package: MarkdownUI
      - package: Splash
  # Persistent UI-proof harness (see Tests/HeelerUITests/USAGE.md). A
  # separate bundle-ui-testing target: XCUITest drives the installed app
  # through the accessibility tree, so proof tests (typing, navigation,
  # sheets, trust alerts) live here instead of throwaway temp targets.
  HeelerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/HeelerUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.houz42.meadow.uitests
    dependencies:
      - target: Heeler




schemes:
  Heeler:
    build:
      targets:
        Heeler: all
    test:
      targets:
        - HeelerTests
      # The only variable the app test process needs from the invoking shell.
      # The fixture itself arrives through the Simulator's launchd environment
      # as HEELER_SSH_E2E_CONFIG / HEELER_SSH_JUMP_E2E_CONFIG /
      # HEELER_PAIRING_E2E_CONFIG, which must stay off this list: an entry here
      # is forwarded unconditionally, substituting an empty string when the
      # shell has not exported it, and would shadow the launchd value.
      environmentVariables:
        HEELER_SSH_E2E_REQUIRED: $(HEELER_SSH_E2E_REQUIRED)
    run:
      config: Debug

  # The Heeler scheme's test action stays HeelerTests-only so every
  # worker's default full-suite run is unaffected; UI proofs run via
  # this dedicated scheme (USAGE.md's run command).
  HeelerUITests:
    build:
      targets:
        HeelerUITests: all
    test:
      targets:
        - HeelerUITests
