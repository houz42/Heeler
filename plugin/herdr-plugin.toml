id = "heeler"
name = "heeler"
version = "0.5.0"
min_herdr_version = "0.7.5"
description = "Meadow host package: pairing, agent notifications, and the host chat broker + agent adapters"
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "ci"]

# Per-session broker supervision: idempotent; only the first session with a
# dead broker spawns a supervisor (single-instance via the owner socket).
[[startup]]
command = ["sh", "scripts/node-trampoline.sh", "src/sidebar-hook.js"]

[[startup]]
command = ["sh", "scripts/node-trampoline.sh", "src/broker-hook.js"]

[[actions]]
id = "pair"
title = "Pair a mobile device"
description = "Show a Pairing Code QR for the Meadow app"
contexts = ["global"]
command = ["sh", "scripts/node-trampoline.sh", "src/pair-action.js"]

[[actions]]
id = "pair-stdout"
title = "Pair a mobile device (foreground stdout)"
description = "Print a Pairing Code QR and the HERDR-PAIR payload directly in the invoking terminal"
contexts = ["global"]
command = ["sh", "scripts/node-trampoline.sh", "src/pair-cli.js"]

[[actions]]
id = "setup"
title = "Meadow host setup"
description = "Install the broker runtime, start the shared broker (one per host), install agent adapter shims"
contexts = ["global"]
command = ["sh", "scripts/node-trampoline.sh", "src/setup-action.js"]

[[actions]]
id = "status"
title = "Meadow host status"
description = "Broker health, supervisor owner, runtime version, adapter shims, live agent registrations"
contexts = ["global"]
command = ["sh", "scripts/node-trampoline.sh", "src/setup-action.js"]

[[actions]]
id = "stop-broker"
title = "Stop the chat broker"
description = "Gracefully stop the shared broker supervisor (adapters reconnect on next start)"
contexts = ["global"]
command = ["sh", "scripts/node-trampoline.sh", "src/setup-action.js"]

[[actions]]
id = "upgrade-broker"
title = "Upgrade the chat broker"
description = "Re-sync the broker runtime from this plugin and restart the broker"
contexts = ["global"]
command = ["sh", "scripts/node-trampoline.sh", "src/setup-action.js"]

[[actions]]
id = "uninstall-adapters"
title = "Uninstall agent adapter shims"
description = "Remove the plugin-owned omp loader shim(s)"
contexts = ["global"]
command = ["sh", "scripts/node-trampoline.sh", "src/setup-action.js"]

[[panes]]
id = "pair"
title = "Pair device"
placement = "popup"
width = "100%"
height = "100%"
command = ["sh", "scripts/node-trampoline.sh", "src/pair-popup.js"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "scripts/node-trampoline.sh", "src/notify-hook.js"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "scripts/node-trampoline.sh", "src/activity-hook.js"]
